name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      # Warnings are treated as errors in CI (see Directory.Build.props)
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: >
          dotnet test --no-build --configuration Release
          --settings coverage.runsettings
          --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Generate coverage report
        if: ${{ !cancelled() }}
        run: >
          dotnet reportgenerator
          -reports:"TestResults/*/coverage.cobertura.xml"
          -targetdir:coveragereport
          -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Add coverage summary to job summary
        if: ${{ !cancelled() }}
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults/**/*.trx
            coveragereport/

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # The Dockerfile runs the unit tests, so this step also fails if any test fails
      - name: Build Docker image
        run: docker build --tag longest-increasing-subsequence .

      - name: Run container with sample input
        run: |
          output=$(echo "6 1 5 9 2" | docker run --rm -i longest-increasing-subsequence)
          echo "Output: $output"
          if [[ "$output" != "1 5 9" ]]; then
            echo "Expected output to be '1 5 9'"
            exit 1
          fi

      - name: Run container with invalid input
        run: |
          if echo "1 x 3" | docker run --rm -i longest-increasing-subsequence; then
            echo "Expected a non-zero exit code for invalid input"
            exit 1
          fi
          echo "Invalid input was rejected with a non-zero exit code"
